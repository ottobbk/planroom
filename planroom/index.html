<body>
  <section id="login" class="login"><div class="login-card"><div class="mark">✦</div><div class="eyebrow">พื้นที่ส่วนตัว</div><h1>แผนงานของฉัน</h1><p>จัดโฟกัสให้แต่ละโปรเจกต์ แล้วเดินหน้าอย่างมีจังหวะ</p><input id="pass" class="field" type="password" inputmode="numeric" placeholder="รหัสผ่าน" aria-label="รหัสผ่าน"><button id="loginBtn" class="primary">เข้าสู่ระบบ</button><div id="error" class="error"></div></div></section>
  <main id="app" class="app"><header class="top"><div class="brand">plan<span>room</span></div><nav class="app-tabs" aria-label="รูปแบบการทำงาน"><button class="app-tab active" data-view="todo">☑ สิ่งที่ต้องทำ</button><button class="app-tab" data-view="ideas">✦ ระดมไอเดีย</button><button class="app-tab" data-view="calendar" aria-label="เปิดปฏิทิน">▦ ปฏิทิน</button><button class="app-tab" data-view="notes">▤ โน้ต</button></nav><div class="theme-picker" aria-label="เลือกธีม"><button class="theme-choice" data-theme="dark" title="ธีมมืด">●</button><button class="theme-choice active" data-theme="neutral" title="ธีมกลาง">◐</button><button class="theme-choice" data-theme="light" title="ธีมขาว">○</button></div><button id="logout" class="logout">ออกจากระบบ</button></header><div class="layout"><div class="intro"><div><div class="eyebrow">ภาพรวมของคุณ</div><h1>วันนี้ จะขยับ<br>เรื่องไหนก่อน?</h1><p id="summary"></p></div><button id="newTask" class="primary">+ เพิ่มงาน</button></div><div class="grid"><aside class="projects panel"><div class="panel-title">โปรเจกต์</div><div id="projects" class="project-list"></div><button id="newProject" class="add-project">+ สร้างโปรเจกต์ใหม่</button></aside><section class="workspace panel"><div class="workspace-head"><div><h2 id="projectTitle"></h2><p id="projectStats"></p></div><div class="workspace-tools"><button class="icon-button" data-view="calendar" title="เปิดปฏิทิน">▦</button><button class="icon-button" data-view="notes" title="เปิดโน้ต">▤</button></div></div><div id="todoView" class="todo"><div class="filters"><button class="filter active" data-filter="all">ทั้งหมด</button><button class="filter" data-filter="todo">ต้องทำ</button><button class="filter" data-filter="done">เสร็จแล้ว</button></div><div id="tasks" class="task-list"></div></div><div id="ideasView" class="brainstorm"><div class="idea-compose"><input id="ideaText" class="field" placeholder="พิมพ์ไอเดีย แล้วเริ่มต้นที่ Concept"><button id="addIdea" class="primary">+ เพิ่มไอเดีย</button></div><div id="board" class="board"></div></div><div id="calendarView" class="calendar"></div><div id="notesView" class="notes"><label for="projectNotes">บันทึกของโปรเจกต์</label><textarea id="projectNotes" placeholder="จดสิ่งที่อยากจำ ลิงก์ อ้างอิง หรือสรุปการประชุม…"></textarea><div id="noteStatus" class="note-status">บันทึกอัตโนมัติ</div></div></section></div></div></main>
  <dialog id="taskDialog" class="dialog"><form id="taskForm"><h3>เพิ่มงานใหม่</h3><label>ชื่องาน</label><input required name="title" class="field" placeholder="เช่น สรุปแผนงานสัปดาห์นี้"><label>กำหนดส่ง (ไม่บังคับ)</label><input name="due" class="field" type="date"><label>ความสำคัญ</label><select name="priority"><option value="medium">ปานกลาง</option><option value="high">สูง</option><option value="low">ต่ำ</option></select><div class="actions"><button type="button" class="secondary" data-close>ยกเลิก</button><button class="primary">บันทึกงาน</button></div></form></dialog>
  <dialog id="projectDialog" class="dialog"><form id="projectForm"><h3>สร้างโปรเจกต์</h3><label>ชื่อโปรเจกต์</label><input required name="name" class="field" placeholder="เช่น งานเว็บไซต์ใหม่"><div class="actions"><button type="button" class="secondary" data-close>ยกเลิก</button><button class="primary">สร้างโปรเจกต์</button></div></form></dialog>
  <script>
    const KEY='planroom-data-v1', LOGIN='planroom-signed-in'; let data=JSON.parse(localStorage.getItem(KEY)||'null')||{projects:[{id:1,name:'เรื่องสำคัญของฉัน',tasks:[],ideas:{concept:[],interest:[],use:[]},pinned:false,notes:''}],selected:1,filter:'all',view:'todo',theme:'neutral'};
    const save=()=>localStorage.setItem(KEY,JSON.stringify(data)); const $=s=>document.querySelector(s); const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    function selected(){data.projects.forEach(x=>{if(!x.ideas)x.ideas={concept:[],interest:[],use:[]};if(typeof x.pinned!=='boolean')x.pinned=false;if(typeof x.notes!=='string')x.notes=''});let p=data.projects.find(p=>p.id===data.selected)||data.projects[0];return p};

    $('#exportData').onclick=()=>{prNormalize();const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`planroom-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};$('#importData').onclick=()=>$('#importFile').click();$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const next=JSON.parse(r.result);if(!Array.isArray(next.projects))throw Error();if(confirm('แทนที่ข้อมูลปัจจุบันด้วยไฟล์สำรองนี้หรือไม่?')){data=next;prNormalize();render()}}catch{alert('ไฟล์สำรองไม่ถูกต้อง')}};r.readAsText(f)};
    $('#archiveToggle').onclick=()=>{prShowArchived=!prShowArchived;$('#archiveToggle').textContent=prShowArchived?'▣ ซ่อนโปรเจกต์ที่เก็บ':'▣ โปรเจกต์ที่เก็บไว้';prDecorate()};$('#enableAlerts').onclick=async()=>{if(!('Notification'in window))return alert('อุปกรณ์นี้ไม่รองรับการแจ้งเตือน');const permission=await Notification.requestPermission();if(permission==='granted'){new Notification('Planroom พร้อมแจ้งเดดไลน์แล้ว');localStorage.setItem('planroom-notifications','enabled')}};
    $('#calendarView').onclick=e=>{const move=e.target.dataset.cal;if(move){const d=new Date(data.calendarMonth||Date.now());d.setMonth(d.getMonth()+(move==='next'?1:-1));data.calendarMonth=d.toISOString();save();prRenderCalendar()}};$('#calendarView').addEventListener('change',e=>{if(e.target.id==='calendarScope'){data.calendarAll=e.target.value==='all';save();prRenderCalendar()}});
    $('#board').addEventListener('touchstart',e=>{const card=e.target.closest('.idea-card');if(!card)return;prTouch={id:+card.dataset.idea,card};card.classList.add('dragging')},{passive:true});$('#board').addEventListener('touchmove',e=>{if(!prTouch)return;const t=e.touches[0],target=document.elementFromPoint(t.clientX,t.clientY)?.closest('.idea-column');document.querySelectorAll('.idea-column').forEach(x=>x.classList.toggle('drag-over',x===target))},{passive:true});$('#board').addEventListener('touchend',e=>{if(!prTouch)return;const t=e.changedTouches[0],stack=document.elementFromPoint(t.clientX,t.clientY)?.closest('[data-drop]');if(stack){let item;Object.values(selected().ideas).forEach(list=>{const i=list.findIndex(x=>x.id===prTouch.id);if(i>-1)item=list.splice(i,1)[0]});if(item)selected().ideas[stack.dataset.drop].unshift(item);render()}document.querySelectorAll('.idea-column').forEach(x=>x.classList.remove('drag-over'));prTouch=null});
    prNormalize();render();
  </script>
  <script src="cloud-sync.js"></script>
</body>
</html>
